{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-sm-8 col-md-6 col-lg-5">
    <h1 class="h5 mb-3">Change password</h1>
    <form method="post">{% csrf_token %}
      {% for field in form %}
        <div class="mb-3">
          <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
          <input class="form-control form-control-lg{% if field.errors %} is-invalid{% endif %}"
                 type="password" name="{{ field.html_name }}" id="{{ field.id_for_label }}"
                 autocomplete="{% if forloop.first %}current-password{% else %}new-password{% endif %}" required>
          {% for e in field.errors %}<div class="invalid-feedback">{{ e }}</div>{% endfor %}
          {% if field.help_text %}<div class="form-text">{{ field.help_text|safe }}</div>{% endif %}
        </div>
      {% endfor %}
      <button class="btn btn-primary btn-lg w-100" type="submit">Change password</button>
    </form>
  </div>
</div>
{% endblock %}
