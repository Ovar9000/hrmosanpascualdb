{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Print{% endblock %} · San Pascual</title>
  <link rel="stylesheet" href="{% static 'vendor/bootstrap/bootstrap.min.css' %}">
  <style>
    body { background: #e9ecef; font-family: Arial, Helvetica, sans-serif; color: #000; }
    .sheet { background: #fff; margin: 1rem auto; padding: 12mm; box-shadow: 0 0 6px rgba(0,0,0,.2); }
    .sheet.portrait { width: 216mm; min-height: 330mm; }
    .sheet.landscape { width: 330mm; min-height: 216mm; }
    .toolbar { max-width: 330mm; margin: 1rem auto 0; }
    table.form-table { width: 100%; border-collapse: collapse; }
    table.form-table td, table.form-table th { border: 1px solid #000; padding: 3px 5px; vertical-align: top; }
    .box { display: inline-block; width: 11px; height: 11px; border: 1px solid #000; margin-right: 4px; vertical-align: -1px; text-align: center; line-height: 9px; font-size: 10px; }
    .line { border-bottom: 1px solid #000; display: inline-block; min-width: 120px; padding: 0 4px; }
    .sig { border-top: 1px solid #000; text-align: center; padding-top: 2px; margin-top: 28px; }
    .small-print { font-size: 9pt; }
    .fake { font-size: 8pt; color: #666; text-align: center; margin-top: 8px; }
    @media (max-width: 900px) { .sheet.portrait, .sheet.landscape { width: auto; min-height: 0; padding: 6mm; } }
    @media print {
      @page { margin: 8mm; {% block page_size %}size: legal portrait;{% endblock %} }
      body { background: #fff; }
      .toolbar { display: none !important; }
      .sheet { box-shadow: none; margin: 0; padding: 0; width: auto !important; min-height: 0 !important; }
    }
    {% block style %}{% endblock %}
  </style>
</head>
<body>
  <div class="toolbar d-flex flex-wrap gap-2 px-2">
    <a class="btn btn-sm btn-outline-secondary bg-white" href="{% block back %}{% url 'home' %}{% endblock %}">← Back</a>
    <button class="btn btn-sm btn-primary" type="button" onclick="window.print()">Print</button>
    <span class="small text-muted align-self-center">Use your browser's print dialog; choose "Save as PDF" for a file.</span>
  </div>
  {% block sheet %}{% endblock %}
  <div class="fake">Prototype · fake data only</div>
</body>
</html>
