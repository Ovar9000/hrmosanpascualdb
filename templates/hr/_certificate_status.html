{% if req.status == "pending" %}<span class="badge text-bg-warning">Being prepared</span>{% elif req.status == "ready" %}<span class="badge text-bg-success">Ready for release</span>{% elif req.status == "released" %}<span class="badge text-bg-secondary">Released {{ req.released_at|date:"M d, Y" }}</span>{% elif req.status == "declined" %}<span class="badge text-bg-danger">Declined</span>{% else %}<span class="badge text-bg-light border">Cancelled</span>{% endif %}
