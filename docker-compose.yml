# Local development stack.
#   db     - PostgreSQL. Port is NOT published to the host.
#   manage - one-shot container that runs migrations as the DB owner role, then exits.
#            Also used for tests and other owner-level commands.
#   web    - the website, connected as the restricted app role.
# Values come from .env (copy .env.example). Only the variables each service needs
# are passed in, so the web container never receives the owner password via env.

x-django-env: &django-env
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set in .env}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
  DJANGO_HTTPS: ${DJANGO_HTTPS:-0}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1,::1}
  CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-}
  PROTOTYPE_FAKE_DATA_ONLY: ${PROTOTYPE_FAKE_DATA_ONLY:-1}
  MIN_EMPLOYEE_AGE: ${MIN_EMPLOYEE_AGE:-18}
  MAX_EMPLOYEE_AGE: ${MAX_EMPLOYEE_AGE:-90}
  ONE_TIME_PASSWORD_DAYS: ${ONE_TIME_PASSWORD_DAYS:-14}
  RESET_PASSWORD_HOURS: ${RESET_PASSWORD_HOURS:-24}
  MFA_REQUIRED: ${MFA_REQUIRED:-0}
  MFA_REMEMBER_DAYS: ${MFA_REMEMBER_DAYS:-30}
  MFA_REQUIRED_ROLES: ${MFA_REQUIRED_ROLES:-HRMO Staff,Auditor,System Admin}
  SALARY_TRACKING_START: ${SALARY_TRACKING_START:-2026-10-01}
  SALARY_LOOKAHEAD_DAYS: ${SALARY_LOOKAHEAD_DAYS:-90}
  RENEWAL_LOOKAHEAD_DAYS: ${RENEWAL_LOOKAHEAD_DAYS:-45}
  LEAVE_APPROVAL_STEPS: ${LEAVE_APPROVAL_STEPS:-recommend,certify,approve}
  LEAVE_FORM_CERTIFIER: ${LEAVE_FORM_CERTIFIER:-}
  LEAVE_FORM_CERTIFIER_TITLE: ${LEAVE_FORM_CERTIFIER_TITLE:-Administrative Officer V}
  LEAVE_FORM_MAYOR: ${LEAVE_FORM_MAYOR:-}
  HR_MODULES: ${HR_MODULES:-}
  OFFICIAL_EMAIL_DOMAIN: ${OFFICIAL_EMAIL_DOMAIN-sanpascualmasbate.gov.ph}
  OFFICIAL_EMAIL_PANEL: ${OFFICIAL_EMAIL_PANEL:-the GWHS cPanel}
  OFFICIAL_EMAIL_WEBMAIL: ${OFFICIAL_EMAIL_WEBMAIL:-}
  DB_HOST: db
  DB_NAME: ${POSTGRES_DB:?set in .env}

x-django-app: &django-app
  build: .
  volumes:
    - .:/app            # dev only: live code reload. Drop this mount on a real server.
    - media:/data/media

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      APP_DB_USER: ${APP_DB_USER:?set in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20

  manage:
    <<: *django-app
    environment:
      <<: *django-env
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Name only (no password): migrations restrict this role's audit-table privileges.
      APP_DB_USER: ${APP_DB_USER:?set in .env}
    command: python manage.py migrate --noinput
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *django-app
    environment:
      <<: *django-env
      DB_USER: ${APP_DB_USER}
      DB_PASSWORD: ${APP_DB_PASSWORD}
    # --insecure lets runserver serve /static/ when DJANGO_DEBUG=0 (prototype only). A real
    # server uses gunicorn with the reverse proxy serving /static/ (Go-Live Checklist).
    command: python manage.py runserver --insecure 0.0.0.0:8000
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      manage:
        condition: service_completed_successfully

volumes:
  pgdata:
  media:
